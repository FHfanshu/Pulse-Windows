[package]
name = "pulse"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pulse-core = { path = "../crates/pulse-core" }
tauri = { version = "2", features = ["tray-icon"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono.workspace = true
tiny-skia = "0.11"
ab_glyph = "0.2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
# Toasts with a click handler (the plugin cannot report a click on desktop); already in the lock
# file as the plugin's own dependency.
tauri-winrt-notification = "0.8"
base64 = "0.22"
# The `implement` macro expands to paths in this crate (the `windows` crate re-exports it as `windows::core`).
windows-core = "0.58"
windows = { version = "0.58", features = [
  "implement",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_Globalization",
  "Win32_UI_Shell",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_Graphics_Dwm",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Composition",
  "Foundation",
  "Foundation_Numerics",
  "UI",
  "UI_Composition",
  "UI_Composition_Desktop",
  "UI_ViewManagement",
  "Graphics",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_System_WinRT_Graphics_Direct2D",
  "System",
] }
