name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      expected-tag:
        description: Optional release tag that must match the app version
        type: string
        default: ''
      sign-updates:
        description: Also build the signed updater artifacts (installer signature and latest.json); needs the signing key secrets
        type: boolean
        default: false
    outputs:
      version:
        description: Validated application version
        value: ${{ jobs.windows.outputs.version }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Windows x64 checks and packaging
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      # No debug info for test/dev builds: CI only needs pass/fail, and it is most of the compile
      # time and of the cache that has to be restored.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      # Pull requests only check and test; the release build and installer (about 4 minutes) are
      # made on main, on demand and for releases.
      PACKAGE: ${{ github.event_name != 'pull_request' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate application version
        id: version
        env:
          PULSE_RELEASE_TAG: ${{ inputs.expected-tag }}
        run: node scripts/check-release-version.mjs
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck and build frontend
        run: npm run build
      - name: Check native backdrop snapshots
        run: node scripts/check-native-shapes.mjs
      - name: Test Rust workspace
        run: cargo test --workspace --all-targets --locked
      - name: Build Windows installer
        if: ${{ env.PACKAGE == 'true' && !inputs.sign-updates }}
        run: npm run tauri build -- --target x86_64-pc-windows-msvc -- --locked
      # The updater artifacts need the private key, which pull requests do not have: only a release
      # build (release.yml passes sign-updates) signs the installer.
      - name: Build Windows installer with signed updater artifacts
        if: ${{ inputs.sign-updates }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --config src-tauri/tauri.release.conf.json -- --locked
      - name: Package distributables and checksums
        if: ${{ env.PACKAGE == 'true' }}
        run: ./scripts/package-windows.ps1 -RequireUpdaterArtifacts:$${{ inputs.sign-updates && 'true' || 'false' }}
      - name: Upload Windows build
        if: ${{ env.PACKAGE == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pulse-windows-x64
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14
